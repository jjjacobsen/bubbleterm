[tools]
go = "1.26"

[tasks.build]
run = "go build ./..."

[tasks.install]
description = "Install the BubbleTerm binary and Omarchy launcher"
run = '''
data_home=${XDG_DATA_HOME:-$HOME/.local/share}
icon="$data_home/bubbleterm/bubbleterm.png"
app_class=org.omarchy.bubbleterm

mkdir -p "$HOME/.local/bin" "$data_home/applications"
go build -o "$HOME/.local/bin/bubbleterm" .
install -Dm644 assets/bubbleterm.png "$icon"

cat >"$data_home/applications/BubbleTerm.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=BubbleTerm
Exec=xdg-terminal-exec --app-id=$app_class -e "$HOME/.local/bin/bubbleterm"
Icon=$icon
Terminal=false
StartupWMClass=$app_class
StartupNotify=true
EOF
'''

[tasks.chat]
run = "go run ."
